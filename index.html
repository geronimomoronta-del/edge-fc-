<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDGE FC</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#070b10;
  color:#f4f7fa;
  font-family:Arial,sans-serif
}
header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #1b2530;
  background:#090e14
}
.logo{
  font-weight:800;
  font-size:20px
}
.live{
  color:#9cff3b;
  font-size:12px;
  font-weight:700
}
main{
  max-width:1000px;
  margin:auto;
  padding:22px 16px
}
h1{
  font-size:26px;
  margin:4px 0 6px
}
.sub{
  color:#8593a3;
  margin-bottom:22px
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px
}
.stat{
  background:#0d151d;
  border:1px solid #1b2833;
  border-radius:10px;
  padding:15px
}
.stat small{
  color:#748392;
  display:block;
  font-size:10px;
  margin-bottom:8px
}
.stat b{
  font-size:20px
}
.panel{
  background:#0c131a;
  border:1px solid #1b2833;
  border-radius:12px;
  overflow:hidden
}
.panel-title{
  padding:16px;
  font-weight:700;
  border-bottom:1px solid #1b2833
}
.match{
  padding:15px 16px;
  border-bottom:1px solid #17212a
}
.match:last-child{
  border-bottom:0
}
.league{
  color:#718090;
  font-size:11px;
  margin-bottom:7px
}
.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}
.names{
  font-weight:700;
  line-height:1.55
}
.score{
  font-size:20px;
  font-weight:800;
  white-space:nowrap
}
.status{
  margin-top:7px;
  font-size:11px;
  color:#9cff3b
}
.loading,.error{
  padding:30px;
  text-align:center;
  color:#8795a4
}
.error{color:#ff7474}
.refresh{
  background:#9cff3b;
  border:0;
  color:#091006;
  font-weight:800;
  border-radius:8px;
  padding:10px 14px
}
@media(max-width:650px){
  .stats{grid-template-columns:repeat(2,1fr)}
  h1{font-size:22px}
}
</style>
</head>

<body>

<header>
  <div class="logo">🟩 EDGE FC</div>
  <div class="live">● REAL DATA</div>
</header>

<main>

<h1>Football Betting Terminal</h1>
<div class="sub">Datos reales obtenidos desde API-Football</div>

<div class="stats">
  <div class="stat">
    <small>PARTIDOS</small>
    <b id="total">—</b>
  </div>

  <div class="stat">
    <small>EN VIVO</small>
    <b id="live">—</b>
  </div>

  <div class="stat">
    <small>FINALIZADOS</small>
    <b id="finished">—</b>
  </div>

  <div class="stat">
    <small>LIGAS</small>
    <b id="leagues">—</b>
  </div>
</div>

<div class="panel">

  <div class="panel-title">
    Partidos
    <button class="refresh" onclick="loadMatches()" style="float:right">
      Actualizar
    </button>
  </div>

  <div id="matches" class="loading">
    Cargando datos reales...
  </div>

</div>

</main>

<script>
async function loadMatches(){

  const box=document.getElementById("matches");

  box.className="loading";
  box.innerHTML="Cargando datos reales...";

  try{

    const response=await fetch("/api/data?ts="+Date.now());
    const json=await response.json();

    const matches=
      json.matches ||
      json.data ||
      json.response ||
      [];

    document.getElementById("total").textContent=matches.length;

    const liveMatches=matches.filter(m=>{
      const s=m.fixture?.status?.short;
      return ["1H","HT","2H","ET","BT","P","LIVE"].includes(s);
    });

    const finished=matches.filter(m=>{
      return m.fixture?.status?.short==="FT";
    });

    const leagues=new Set(
      matches.map(m=>m.league?.id).filter(Boolean)
    );

    document.getElementById("live").textContent=liveMatches.length;
    document.getElementById("finished").textContent=finished.length;
    document.getElementById("leagues").textContent=leagues.size;

    if(!matches.length){
      box.className="loading";
      box.innerHTML="No hay partidos disponibles en este momento.";
      return;
    }

    box.className="";

    box.innerHTML=matches.map(m=>{

      const home=m.teams?.home?.name || "Local";
      const away=m.teams?.away?.name || "Visitante";

      const hg=m.goals?.home;
      const ag=m.goals?.away;

      const score=
        hg!==null && hg!==undefined
        ? `${hg} - ${ag}`
        : "vs";

      const league=m.league?.name || "Competición";
      const country=m.league?.country || "";
      const status=m.fixture?.status?.long || "";

      return `
        <div class="match">
          <div class="league">${country} · ${league}</div>

          <div class="teams">
            <div class="names">
              ${home}<br>
              ${away}
            </div>

            <div class="score">
              ${score}
            </div>
          </div>

          <div class="status">
            ${status}
          </div>
        </div>
      `;

    }).join("");

  }catch(error){

    box.className="error";
    box.innerHTML="Error cargando los datos de API-Football.";

    console.error(error);
  }
}

loadMatches();

setInterval(loadMatches,60000);
</script>

</body>
</html>
