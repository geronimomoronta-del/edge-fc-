<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDGE FC</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070b10;
  color:#f4f7fa;
  font-family:Arial,sans-serif
}

header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #1b2530;
  background:#090e14
}

.logo{
  font-weight:800;
  font-size:20px
}

.real{
  color:#91ff32;
  font-size:12px;
  font-weight:800
}

main{
  max-width:1000px;
  margin:auto;
  padding:22px 16px
}

h1{
  font-size:26px;
  margin:4px 0 6px
}

.sub{
  color:#8593a3;
  margin-bottom:20px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px
}

.stat{
  background:#0d151d;
  border:1px solid #1b2833;
  border-radius:10px;
  padding:15px
}

.stat small{
  color:#748392;
  display:block;
  font-size:10px;
  margin-bottom:8px
}

.stat b{
  font-size:20px
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px
}

.tab{
  border:1px solid #26333e;
  background:#0d151d;
  color:#9aa7b4;
  padding:12px 5px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer
}

.tab.active{
  background:#91ff32;
  color:#071006;
  border-color:#91ff32
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:15px 0;
  gap:10px
}

.priority{
  font-size:12px;
  color:#93a0ad
}

.refresh{
  border:0;
  background:#91ff32;
  color:#071006;
  padding:10px 13px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer
}

.panel{
  background:#0c131a;
  border:1px solid #1b2833;
  border-radius:12px;
  overflow:hidden
}

.match{
  padding:15px 16px;
  border-bottom:1px solid #17212a
}

.match:last-child{
  border-bottom:0
}

.match.latam{
  border-left:3px solid #91ff32
}

.league{
  color:#718090;
  font-size:11px;
  margin-bottom:8px
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.names{
  font-weight:700;
  line-height:1.55
}

.score{
  font-size:20px;
  font-weight:800;
  white-space:nowrap
}

.status{
  margin-top:7px;
  font-size:11px;
  color:#91ff32
}

.date{
  margin-top:7px;
  font-size:11px;
  color:#8492a0
}

.analyze{
  margin-top:12px;
  border:1px solid #91ff32;
  background:transparent;
  color:#91ff32;
  border-radius:8px;
  padding:9px 12px;
  font-weight:800;
  cursor:pointer
}

.value-box{
  margin-top:12px;
  background:#071009;
  border:1px solid #25421e;
  border-radius:9px;
  padding:12px
}

.value-title{
  font-size:12px;
  color:#91ff32;
  font-weight:800;
  margin-bottom:10px
}

.value-row{
  display:grid;
  grid-template-columns:1.1fr .8fr .8fr .8fr;
  gap:6px;
  padding:8px 0;
  border-bottom:1px solid #17261a;
  font-size:12px
}

.value-row:last-child{
  border-bottom:0
}

.value-good{
  color:#91ff32;
  font-weight:800
}

.value-bad{
  color:#8d99a5
}

.value-details{
  margin-top:4px;
  color:#8593a3;
  font-size:10px;
  line-height:1.5
}

.empty,.error{
  padding:35px;
  text-align:center;
  color:#8492a0
}

.error{
  color:#ff7272
}

@media(max-width:650px){
  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  h1{
    font-size:22px
  }

  .tab{
    font-size:11px
  }

  .value-row{
    grid-template-columns:1fr 1fr
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🟩 EDGE FC</div>
  <div class="real">● REAL DATA</div>
</header>

<main>

<h1>Football Betting Terminal</h1>

<div class="sub">
  Datos reales · Odds · Predictions · EDGE · EV
</div>

<div class="stats">

  <div class="stat">
    <small>TOTAL</small>
    <b id="total">—</b>
  </div>

  <div class="stat">
    <small>EN VIVO</small>
    <b id="liveCount">—</b>
  </div>

  <div class="stat">
    <small>PRÓXIMOS</small>
    <b id="nextCount">—</b>
  </div>

  <div class="stat">
    <small>FINALIZADOS</small>
    <b id="finishedCount">—</b>
  </div>

</div>

<div class="tabs">

  <button class="tab active"
    onclick="changeTab('live',this)">
    🔴 EN VIVO
  </button>

  <button class="tab"
    onclick="changeTab('next',this)">
    🕒 PRÓXIMOS
  </button>

  <button class="tab"
    onclick="changeTab('finished',this)">
    ✅ FINALIZADOS
  </button>

</div>

<div class="toolbar">

  <div class="priority">
    🇦🇷 LATAM tiene prioridad
  </div>

  <button class="refresh"
    onclick="loadMatches()">
    Actualizar
  </button>

</div>

<div class="panel" id="matches">

  <div class="empty">
    Cargando partidos...
  </div>

</div>

</main>

<script>

let allMatches=[];
let currentTab="live";

const liveStatuses=[
  "1H","HT","2H","ET","BT","P","INT","LIVE"
];

const latamCountries=[
  "Argentina",
  "Brazil",
  "Brasil",
  "Uruguay",
  "Chile",
  "Paraguay",
  "Bolivia",
  "Peru",
  "Ecuador",
  "Colombia",
  "Venezuela",
  "Mexico",
  "Costa Rica",
  "Panama",
  "Honduras",
  "Guatemala",
  "El Salvador",
  "Nicaragua",
  "Dominican Republic"
];

function isLive(m){
  return liveStatuses.includes(
    m.fixture?.status?.short
  );
}

function isFinished(m){
  return ["FT","AET","PEN"].includes(
    m.fixture?.status?.short
  );
}

function isNext(m){
  return ["NS","TBD"].includes(
    m.fixture?.status?.short
  );
}

function isLatam(m){
  return latamCountries.includes(
    m.league?.country
  );
}

function prioritySort(a,b){

  const aLatam=isLatam(a)?1:0;
  const bLatam=isLatam(b)?1:0;

  if(aLatam!==bLatam){
    return bLatam-aLatam;
  }

  return new Date(a.fixture?.date) -
         new Date(b.fixture?.date);
}

function formatDate(date){

  if(!date)return "";

  try{

    return new Intl.DateTimeFormat(
      "es-AR",
      {
        day:"2-digit",
        month:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    ).format(new Date(date));

  }catch{
    return "";
  }
}

function render(){

  let list=[];

  if(currentTab==="live"){
    list=allMatches.filter(isLive);
  }

  if(currentTab==="next"){
    list=allMatches.filter(isNext);
  }

  if(currentTab==="finished"){
    list=allMatches.filter(isFinished);
  }

  list.sort(prioritySort);

  const box=
    document.getElementById("matches");

  if(!list.length){

    box.innerHTML=
      '<div class="empty">'+
      'No hay partidos en esta categoría.'+
      '</div>';

    return;
  }

  box.innerHTML=
    list.map(m=>{

      const id=m.fixture?.id;

      const home=
        m.teams?.home?.name || "Local";

      const away=
        m.teams?.away?.name || "Visitante";

      const hg=m.goals?.home;
      const ag=m.goals?.away;

      const score=
        hg!==null &&
        hg!==undefined &&
        ag!==null &&
        ag!==undefined
        ? `${hg} - ${ag}`
        : "vs";

      const country=
        m.league?.country || "";

      const league=
        m.league?.name || "Competición";

      const status=
        m.fixture?.status?.long ||
        m.fixture?.status?.short ||
        "";

      const elapsed=
        m.fixture?.status?.elapsed;

      let statusText=status;

      if(isLive(m) && elapsed){
        statusText=
          `🔴 ${elapsed}' · ${status}`;
      }

      const analyzeButton=
        currentTab==="next"
        ? `
        <button
          class="analyze"
          onclick="analyzeValue(${id})">
          📊 Analizar valor
        </button>

        <div id="value-${id}"></div>
        `
        : "";

      return `
        <div class="match ${isLatam(m)?"latam":""}">

          <div class="league">
            ${isLatam(m)?"★ ":""}
            ${country} · ${league}
          </div>

          <div class="teams">

            <div class="names">
              ${home}<br>
              ${away}
            </div>

            <div class="score">
              ${score}
            </div>

          </div>

          <div class="status">
            ${statusText}
          </div>

          <div class="date">
            ${formatDate(m.fixture?.date)}
          </div>

          ${analyzeButton}

        </div>
      `;

    }).join("");
}

function changeTab(tab,button){

  currentTab=tab;

  document
    .querySelectorAll(".tab")
    .forEach(b=>{
      b.classList.remove("active");
    });

  button.classList.add("active");

  render();
}

async function analyzeValue(fixture){

  const box=
    document.getElementById(
      "value-"+fixture
    );

  box.innerHTML=
    '<div class="value-box">'+
    'Calculando EDGE...'+
    '</div>';

  try{

    const response=
      await fetch(
        "/api/data?action=value&fixture="+
        fixture
      );

    const json=
      await response.json();

    if(!json.ok){

      box.innerHTML=
        '<div class="value-box error">'+
        (json.error ||
        "No se pudo analizar este partido.")+
        '</div>';

      return;
    }

    const opportunities=
      json.opportunities || [];

    const rows=
      opportunities.map(o=>{

        const good=
          o.value
          ? "value-good"
          : "value-bad";

        const symbol=
          o.value ? "🟢" : "⚪";

        return `
          <div class="value-row ${good}">

            <div>
              ${symbol} ${o.selection}
            </div>

            <div>
              Cuota ${o.odd}
            </div>

            <div>
              EDGE ${o.edge}%
            </div>

            <div>
              EV ${o.ev}%
            </div>

            <div class="value-details">
              Mercado:
              ${o.market_probability}%
            </div>

            <div class="value-details">
              Modelo:
              ${o.model_probability}%
            </div>

            <div class="value-details">
              Cuota justa:
              ${o.fair_odd}
            </div>

          </div>
        `;

      }).join("");

    box.innerHTML=`
      <div class="value-box">

        <div class="value-title">
          VALUE FINDER · ${json.bookmaker}
        </div>

        ${rows}

        <div class="value-details">
          ${json.prediction_advice || ""}
        </div>

      </div>
    `;

  }catch(error){

    box.innerHTML=
      '<div class="value-box error">'+
      'Error calculando el Value Finder.'+
      '</div>';
  }
}

async function loadMatches(){

  const box=
    document.getElementById("matches");

  box.innerHTML=
    '<div class="empty">'+
    'Actualizando datos reales...'+
    '</div>';

  try{

    const response=
      await fetch(
        "/api/data?ts="+Date.now()
      );

    const json=
      await response.json();

    allMatches=
      json.matches ||
      json.data ||
      json.response ||
      [];

    const live=
      allMatches.filter(isLive);

    const next=
      allMatches.filter(isNext);

    const finished=
      allMatches.filter(isFinished);

    document
      .getElementById("total")
      .textContent=
      allMatches.length;

    document
      .getElementById("liveCount")
      .textContent=
      live.length;

    document
      .getElementById("nextCount")
      .textContent=
      next.length;

    document
      .getElementById("finishedCount")
      .textContent=
      finished.length;

    render();

  }catch(error){

    box.innerHTML=
      '<div class="error">'+
      'Error cargando API-Football.'+
      '</div>';
  }
}

loadMatches();

setInterval(
  loadMatches,
  60000
);

</script>

</body>
</html>
